name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          go mod download
          go build ./...

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          install-mode: goinstall

      - name: test
        run: go test -race ./...
